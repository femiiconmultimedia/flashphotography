<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photography Training</title>
<style>
  :root{
    --sky-50:#f4fafd;
    --sky-100:#e6f3fb;
    --sky-200:#cfe7f5;
    --sky-300:#a9d6ec;
    --red-600:#8c1a2c;
    --red-700:#7a1220;
    --red-800:#5f0d18;
    --ink:#0e1c25;
    --muted:#4a6272;
    --radius:18px;
    --shadow:0 18px 40px -22px rgba(14,28,37,.45);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(900px 520px at 88% -12%, #ffffff 0%, rgba(255,255,255,0) 62%),
      radial-gradient(760px 520px at -12% 18%, #d8ecf8 0%, rgba(216,236,248,0) 58%),
      radial-gradient(700px 500px at 100% 108%, #f7dde2 0%, rgba(247,221,226,0) 60%),
      linear-gradient(180deg,#f4fafd 0%, #e3f1fa 55%, #d3e8f5 100%);
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:1100px;margin:0 auto;padding:56px 20px 90px}
  .pay-wrap{max-width:660px;text-align:center}

  /* ---------- views ---------- */
  .view{display:none}
  .view.is-active{display:block;animation:fadeUp .45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .view.is-active{animation:none}
  }

  /* ---------- typography ---------- */
  .eyebrow{
    display:inline-block;margin:0;
    font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--red-700);
  }
  .eyebrow::before{
    content:"";display:inline-block;width:26px;height:2px;margin-right:10px;
    vertical-align:middle;background:var(--red-700);opacity:.65;border-radius:2px;
  }

  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:clamp(2.05rem,5.2vw,3.7rem);
    line-height:1.05;
    letter-spacing:-.02em;
    margin:.4em 0 0;
    color:var(--ink);
  }
  h1 .accent{display:block;color:var(--red-700);font-style:italic}

  .sub{
    max-width:62ch;
    margin:20px 0 0;
    font-size:1.04rem;
    line-height:1.68;
    color:var(--muted);
  }

  /* ---------- image frames ---------- */
  .img-frame{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    background:linear-gradient(135deg,#eaf5fc,#cfe7f5);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow);
  }
  .img-frame img{display:none;width:100%;height:100%;object-fit:cover}
  .img-frame .ph{
    position:absolute;inset:10px;
    display:grid;place-items:center;text-align:center;padding:18px;
    border:2px dashed #b9d8ea;border-radius:14px;
    color:#6d8ea3;font-size:.85rem;letter-spacing:.03em;line-height:1.5;
  }
  .img-frame.hero{aspect-ratio:16/11}
  .img-frame.hero .ph{font-size:.9rem}

  /* ---------- product layout ---------- */
  .stage{
    display:grid;
    grid-template-columns:1.6fr .95fr;
    gap:30px;
    align-items:start;
    margin-top:38px;
  }
  @media (max-width:880px){
    .stage{grid-template-columns:1fr;gap:22px}
  }

  .buy-card{
    background:#fff;
    border:1px solid #e6f2fa;
    border-radius:var(--radius);
    padding:26px 24px;
    box-shadow:var(--shadow);
    position:sticky;
    top:26px;
  }
  @media (max-width:880px){ .buy-card{position:static} }

  .price{
    font-family:Georgia,serif;
    font-size:2.2rem;
    font-weight:700;
    color:var(--red-800);
    margin:0;
    letter-spacing:-.01em;
  }
  .price-note{
    margin:8px 0 22px;
    font-size:.85rem;
    color:var(--muted);
    line-height:1.5;
  }
  .micro{
    margin:14px 0 0;
    font-size:.76rem;
    line-height:1.55;
    color:#7b93a3;
    text-align:center;
  }

  .btn-buy{
    width:100%;
    border:0;cursor:pointer;
    background:linear-gradient(180deg,var(--red-600),#6a0f1e);
    color:#fff;
    font-size:1.02rem;font-weight:700;letter-spacing:.01em;
    padding:17px 20px;border-radius:14px;
    box-shadow:0 14px 28px -14px rgba(122,18,32,.9);
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn-buy:hover{transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 20px 34px -14px rgba(122,18,32,.95)}
  .btn-buy:active{transform:translateY(1px)}

  /* ---------- gallery ---------- */
  .gallery-head{margin-top:64px}
  .gallery-head h2{
    font-family:Georgia,serif;
    font-size:clamp(1.5rem,3vw,2.1rem);
    letter-spacing:-.015em;
    margin:0;
    color:var(--ink);
  }
  .gallery-head p{
    margin:10px 0 0;
    font-size:.95rem;
    color:var(--muted);
    line-height:1.6;
    max-width:60ch;
  }
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:18px;
    margin-top:26px;
  }
  .tile{
    background:#fff;
    border:1px solid #e6f2fa;
    border-radius:16px;
    padding:12px 12px 18px;
    box-shadow:0 14px 28px -24px rgba(14,28,37,.6);
  }
  .tile .img-frame{aspect-ratio:1/1;border-radius:12px;box-shadow:none;border-color:#e6f2fa}
  .tile .img-frame .ph{font-size:.72rem;inset:6px}
  .tile h3{
    font-size:.98rem;
    margin:15px 2px 7px;
    color:var(--red-800);
    letter-spacing:-.01em;
  }
  .tile p{
    margin:0 2px;
    font-size:.87rem;
    line-height:1.58;
    color:var(--muted);
  }

  /* ---------- payment / quote card ---------- */
  .pay-card{
    background:#fff;
    border:1px solid #e6f2fa;
    border-radius:22px;
    padding:30px 26px;
    box-shadow:var(--shadow);
    margin-top:30px;
    text-align:left;
  }
  .amount-label{
    margin:0;
    font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
  }
  .amount{
    font-family:Georgia,serif;
    font-size:2.5rem;
    font-weight:700;
    color:var(--red-800);
    margin:6px 0 22px;
    letter-spacing:-.02em;
  }

  .detail{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 16px;
    border-radius:14px;
    background:var(--sky-50);
    border:1px solid var(--sky-200);
  }
  .detail + .detail{margin-top:10px}
  .detail .k{
    display:block;
    font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#6d8ea3;margin-bottom:3px;
  }
  .detail .v{
    display:block;
    font-size:1.02rem;font-weight:700;color:var(--ink);letter-spacing:.01em;
  }
  .copy{
    flex:0 0 auto;
    border:1px solid var(--sky-300);
    background:#fff;
    color:var(--red-700);
    font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:9px 13px;border-radius:10px;cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .copy:hover{background:var(--sky-100)}
  .copy.copied{background:var(--red-700);border-color:var(--red-700);color:#fff}

  /* ---------- quote factors ---------- */
  .factors{
    list-style:none;
    margin:14px 0 0;
    padding:0;
    display:grid;
    gap:10px;
  }
  .factor{
    display:flex;
    gap:14px;
    align-items:flex-start;
    padding:14px 16px;
    border-radius:14px;
    background:var(--sky-50);
    border:1px solid var(--sky-200);
  }
  .factor .num{
    flex:0 0 auto;
    width:26px;height:26px;
    display:grid;place-items:center;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--sky-300);
    color:var(--red-700);
    font-size:.74rem;font-weight:700;
    line-height:1;
  }
  .factor .ft{
    margin:0 0 3px;
    font-size:.95rem;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.005em;
  }
  .factor .fd{
    margin:0;
    font-size:.86rem;
    line-height:1.55;
    color:var(--muted);
  }

  /* ---------- whatsapp button ---------- */
  .btn-wa{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:24px;
    padding:17px 20px;
    border-radius:14px;
    background:linear-gradient(180deg,var(--red-600),#6a0f1e);
    color:#fff;text-decoration:none;
    font-size:1rem;font-weight:700;letter-spacing:.01em;
    box-shadow:0 14px 28px -14px rgba(122,18,32,.9);
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn-wa:hover{transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 20px 34px -14px rgba(122,18,32,.95)}
  .btn-wa svg{width:20px;height:20px;fill:currentColor;flex:0 0 auto}

  .after{
    margin:18px 2px 0;
    font-size:.83rem;
    line-height:1.6;
    color:var(--muted);
  }

  .back{
    display:inline-block;
    margin-top:28px;
    background:none;border:0;cursor:pointer;
    font-size:.85rem;font-weight:600;color:var(--red-700);
    padding:8px 4px;
    border-bottom:1px solid rgba(122,18,32,.25);
  }
  .back:hover{border-bottom-color:var(--red-700)}

  @media (max-width:520px){
    .wrap{padding:36px 16px 70px}
    .pay-card{padding:24px 18px;border-radius:18px}
    .amount{font-size:2.1rem}
    .detail{padding:12px 13px}
    .detail .v{font-size:.95rem}
    .copy{padding:8px 10px;font-size:.68rem}
  }
</style>
</head>

/* ---------------------------- helpers ---------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);

function mountImage(frame, src, label) {
  const img = frame.querySelector("img");
  const ph  = frame.querySelector(".ph");

  const showPlaceholder = () => {
    img.style.display = "none";
    img.removeAttribute("src");
    ph.style.display = "grid";
    ph.textContent = label || "Add an image URL in CONFIG";
    frame.classList.add("is-empty");
  };
  const showImage = () => {
    img.style.display = "block";
    ph.style.display = "none";
    frame.classList.remove("is-empty");
  };

  if (src && src.trim()) {
    img.alt = label || "";
    img.onload  = showImage;
    img.onerror = showPlaceholder;
    img.src = src;
  } else {
    showPlaceholder();
  }
}

function buildHeadline(el, line1, line2) {
  el.textContent = "";
  el.append(document.createTextNode(line1 || ""));
  if (line2 && line2.trim()) {
    const span = document.createElement("span");
    span.className = "accent";
    span.textContent = line2;
    el.append(span);
  }
}

function waLink(number, message) {
  let digits = String(number).replace(/\D/g, "");
  if (digits.startsWith("0")) digits = "234" + digits.slice(1);
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
}

/* ---------------------------- render: product ---------------------------- */

  $("#p-pricenote").textContent = p.priceNote;
  $("#buy-btn").textContent = p.buyButtonText;
  $("#p-micro").textContent = p.microcopy;

  mountImage($("#p-hero-frame"), p.heroImage, "Main product image");

  $("#g-title").textContent = p.galleryTitle;
  $("#g-sub").textContent = p.gallerySubtitle;

  const gallery = $("#gallery");
  gallery.innerHTML = "";
  (p.gallery || []).forEach(item => {
    const tile = document.createElement("article");
    tile.className = "tile";
    tile.innerHTML =
      '<div class="img-frame"><img alt=""><span class="ph"></span></div>' +
      "<h3></h3><p></p>";
    tile.querySelector("h3").textContent = item.title || "";
    tile.querySelector("p").textContent = item.caption || "";
    mountImage(tile.querySelector(".img-frame"), item.src, item.title);
    gallery.append(tile);
  });
}

/* ---------------------------- render: payment ---------------------------- */
function renderPayment() {
  const p = CONFIG.payment;

  $("#pay-eyebrow").textContent = p.eyebrow;
  buildHeadline($("#pay-heading"), p.heading, p.headingAccent);
  $("#pay-statement").textContent = p.statement;

  $("#pay-amount-label").textContent = p.amountLabel;
  $("#pay-amount").textContent = p.amount;

  const rows = [
    { label: "Account Number", value: p.accountNumber },
    { label: "Account Name",   value: p.accountName },
    { label: "Bank",           value: p.bank }
  ];

  const box = $("#pay-details");
  box.innerHTML = "";
  rows.forEach(row => {
    const el = document.createElement("div");
    el.className = "detail";
    el.innerHTML =
      '<div><span class="k"></span><span class="v"></span></div>' +
      '<button class="copy" type="button">Copy</button>';
    el.querySelector(".k").textContent = row.label;
    el.querySelector(".v").textContent = row.value;
    const btn = el.querySelector(".copy");
    btn.setAttribute("data-copy", row.value);
    btn.setAttribute("aria-label", "Copy " + row.label);
    box.append(el);
  });

  $("#pay-wa").href = waLink(p.whatsappNumber, p.whatsappMessage);
  $("#pay-wa-text").textContent = p.whatsappButtonText;
  $("#pay-after").textContent = p.afterNote;
}

/* ---------------------------- render: quote ---------------------------- */
function renderQuote() {
  const q = CONFIG.quote;

  $("#q-eyebrow").textContent = q.eyebrow;
  buildHeadline($("#q-heading"), q.heading, q.headingAccent);
  $("#q-statement").textContent = q.statement;

  $("#q-factors-label").textContent = q.factorsLabel;

  const list = $("#q-factors");
  list.innerHTML = "";
  (q.factors || []).forEach((f, i) => {
    const li = document.createElement("li");
    li.className = "factor";
    li.innerHTML =
      '<span class="num"></span>' +
      '<div><p class="ft"></p><p class="fd"></p></div>';
    li.querySelector(".num").textContent = String(i + 1).padStart(2, "0");
    li.querySelector(".ft").textContent = f.title || "";
    li.querySelector(".fd").textContent = f.desc || "";
    list.append(li);
  });

  $("#q-wa").href = waLink(q.whatsappNumber, q.whatsappMessage);
  $("#q-wa-text").textContent = q.whatsappButtonText;
  $("#q-after").textContent = q.afterNote;
}

/* ---------------------------- navigation ---------------------------- */
function showView(id) {
  document.querySelectorAll(".view").forEach(v => {
    v.classList.toggle("is-active", v.id === id);
  });
  window.scrollTo(0, 0);
}

/* ---------------------------- copy buttons ---------------------------- */
document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;

  const text = btn.getAttribute("data-copy");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }

  const original = btn.textContent;
  btn.textContent = "Copied";
  btn.classList.add("copied");
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove("copied");
  }, 1600);
});

/* ---------------------------- boot ---------------------------- */
renderProduct();

const isQuoteMode = CONFIG.mode === "quote";
const nextView = isQuoteMode ? "view-quote" : "view-payment";

if (isQuoteMode) {
  renderQuote();
} else {
  renderPayment();
}

$("#buy-btn").addEventListener("click", () => showView(nextView));
$("#back-btn").addEventListener("click", () => showView("view-product"));
$("#q-back-btn").addEventListener("click", () => showView("view-product"));
</script>
